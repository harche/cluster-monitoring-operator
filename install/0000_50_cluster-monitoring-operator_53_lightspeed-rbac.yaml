---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-monitoring-operator-lightspeed
  annotations:
    release.openshift.io/feature-gate: LightspeedProposals
rules:
- apiGroups: ["ols.openshift.io"]
  resources: ["lightspeedproposals"]
  verbs: ["get", "create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["cmo-analysis-prompt", "cmo-trigger-bootstrap-prompt"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-monitoring-operator-lightspeed
  annotations:
    release.openshift.io/feature-gate: LightspeedProposals
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-operator-lightspeed
subjects:
- kind: ServiceAccount
  name: cluster-monitoring-operator
  namespace: openshift-monitoring
